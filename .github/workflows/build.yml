name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, win-x64)
        run: dotnet publish DynamicIsland.csproj -c Release -r win-x64 --self-contained true -o publish/DynamicIsland

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/DynamicIsland -DestinationPath DynamicIsland-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-win-x64
          path: DynamicIsland-win-x64.zip
