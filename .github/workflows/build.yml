name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, win-x64)
        run: dotnet publish DynamicIsland.csproj -c Release -r win-x64 --self-contained true -o publish/DynamicIsland

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/DynamicIsland -DestinationPath DynamicIsland-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-win-x64
          path: DynamicIsland-win-x64.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          [xml]$proj = Get-Content DynamicIsland.csproj
          $ver = ($proj.Project.PropertyGroup | Where-Object Version | Select-Object -First 1).Version
          & $iscc /Q "/DAppVer=$ver" installer/DynamicIsland.iss

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-setup
          path: dist/*-setup.exe
